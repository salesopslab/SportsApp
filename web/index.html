<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetEdge AI</title>
<style>
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#EDE9DF; --line:#DDD6C6;
  --text:#14181F; --sub:#5B6470; --amber:#C77F1D; --teal:#1F8478; --green:#2C8A55; --red:#B84332;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#1B222C; --surface2:#212B37; --line:#2C3644;
    --text:#F4F1EA; --sub:#9AA5B1; --amber:#E8A33D; --teal:#3FB6A8; --green:#3FA66B; --red:#D9614F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#1B222C; --surface2:#212B37; --line:#2C3644;
  --text:#F4F1EA; --sub:#9AA5B1; --amber:#E8A33D; --teal:#3FB6A8; --green:#3FA66B; --red:#D9614F;
  color-scheme:dark;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  display:flex; justify-content:center;
}
.app{ width:100%; max-width:460px; height:100%; display:flex; flex-direction:column; position:relative; }

.topbar{
  padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--line); flex-shrink:0;
}
.brand{ font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.5px; }
.brand span{ color:var(--amber); }
.status-pill{ font-size:11px; color:var(--sub); border:1px solid var(--line); padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:6px; }
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); }
.status-pill.down .status-dot{ background:var(--red); }
.status-pill.waking .status-dot{ background:var(--amber); }

.screen{ display:none; flex:1; overflow-y:auto; padding-bottom:90px; min-height:0; }
.screen.active{ display:block; }

.sport-tabs{ display:flex; gap:8px; padding:14px 20px 4px; overflow-x:auto; }
.sport-tab{ font-size:13px; color:var(--sub); background:var(--surface); border:1px solid var(--line); padding:7px 14px; border-radius:20px; white-space:nowrap; cursor:pointer; }
.sport-tab.active{ color:var(--bg); background:var(--amber); border-color:var(--amber); font-weight:600; }

.board-msg{ padding:40px 20px; text-align:center; color:var(--sub); font-size:13.5px; line-height:1.6; }
.board-msg .spin{ display:inline-block; width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--amber); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:10px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.game-row{ padding:16px 20px; border-bottom:1px solid var(--line); cursor:pointer; }
.game-row:active{ background:var(--surface); }
.game-meta{ display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:10px; gap:10px; }
.game-meta span:last-child{ text-align:right; }
.matchup{ display:flex; flex-direction:column; gap:8px; }
.team-line{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.team-name{ font-size:16px; font-weight:500; }
.odds-cluster{ display:flex; gap:14px; font-family:'Oswald',sans-serif; flex-shrink:0; }
.odds-box{ text-align:right; min-width:44px; }
.odds-box .num{ font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.odds-box .lbl{ font-size:9px; color:var(--sub); text-transform:uppercase; letter-spacing:0.4px; }
.book-note{ margin-top:10px; font-size:11.5px; color:var(--sub); }

.chat-wrap{ display:flex; flex-direction:column; height:100%; padding:0 20px; }
.chat-log{ flex:1; padding:16px 0; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
.msg{ max-width:82%; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.55; white-space:pre-wrap; }
.msg.ai{ background:var(--surface); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.user{ background:var(--surface2); align-self:flex-end; border-bottom-right-radius:4px; }
.msg.ai .src{ display:block; margin-top:8px; font-size:11px; color:var(--teal); }
.msg.hint{ background:none; border:1px dashed var(--line); color:var(--sub); font-size:12.5px; align-self:center; max-width:100%; text-align:center; }
.chat-input-row{ display:flex; gap:10px; align-items:center; padding:14px 0 20px; border-top:1px solid var(--line); flex-shrink:0; }
.chat-input{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:11px 16px; color:var(--text); font-size:14px; font-family:inherit; }
.chat-input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
.mic-btn,.send-btn{ width:42px; height:42px; border-radius:50%; border:none; color:var(--bg); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
.mic-btn{ background:var(--teal); }
.mic-btn.listening{ background:var(--red); animation:pulse 1s ease-in-out infinite; }
.send-btn{ background:var(--amber); }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }

.dossier-hero{ padding:20px; border-bottom:1px solid var(--line); }
.dossier-title{ font-family:'Oswald',sans-serif; font-size:20px; margin-bottom:4px; }
.dossier-sub{ font-size:12px; color:var(--sub); }
.section{ padding:16px 20px; border-bottom:1px solid var(--line); }
.section h3{ font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--sub); font-weight:600; margin-bottom:10px; }
.fact-row{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--line); }
.fact-row:last-child{ border-bottom:none; }
.fact-row .v{ color:var(--sub); text-align:right; }
.tag{ display:inline-block; font-size:11px; padding:3px 8px; border-radius:5px; background:rgba(217,97,79,0.15); color:var(--red); margin-right:6px; }
.tag.ok{ background:rgba(63,166,107,0.15); color:var(--green); }
.empty-note{ font-size:13px; color:var(--sub); }
.ask-ai-btn{ margin:16px 20px 0; padding:11px; border-radius:10px; background:var(--teal); color:var(--bg); border:none; font-size:13.5px; font-weight:600; width:calc(100% - 40px); cursor:pointer; }

.navbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
}
.nav-btn{ flex:1; text-align:center; font-size:11px; color:var(--sub); background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; font-family:inherit; }
.nav-btn .ic{ font-size:19px; }
.nav-btn.active{ color:var(--amber); }
</style>
</head>

<div class="app">

  <div class="topbar">
    <div class="brand">Bet<span>Edge</span> AI</div>
    <div class="status-pill waking" id="apiStatus"><span class="status-dot"></span><span id="apiStatusLabel">Connecting…</span></div>
  </div>

  <!-- BOARD -->
  <div class="screen active" id="board">
    <div class="sport-tabs" id="sportTabs">
      <div class="sport-tab active" data-sport="nfl">NFL</div>
      <div class="sport-tab" data-sport="nba">NBA</div>
      <div class="sport-tab" data-sport="mlb">MLB</div>
      <div class="sport-tab" data-sport="ncaaf">CFB</div>
      <div class="sport-tab" data-sport="ncaab">CBB</div>
    </div>
    <div id="boardList"><div class="board-msg"><div class="spin"></div><div>Loading live odds…</div></div></div>
  </div>

  <!-- CHAT -->
  <div class="screen" id="chat">
    <div class="chat-wrap">
      <div class="chat-log" id="chatLog">
        <div class="msg hint">Tap a game on the Board, then ask about it here — the AI answers using that game's real odds, weather, injuries and history.</div>
      </div>
      <div class="chat-input-row">
        <input class="chat-input" id="chatInput" type="text" placeholder="Ask about the selected matchup…">
        <button class="mic-btn" id="micBtn" title="Voice input">🎤</button>
        <button class="send-btn" id="sendBtn" title="Send">➤</button>
      </div>
    </div>
  </div>

  <!-- DOSSIER -->
  <div class="screen" id="dossier">
    <div id="dossierBody">
      <div class="board-msg">Pick a game from the Board tab to see its full breakdown.</div>
    </div>
  </div>

  <div class="navbar">
    <button class="nav-btn active" data-screen="board"><span class="ic">📋</span>Board</button>
    <button class="nav-btn" data-screen="chat"><span class="ic">💬</span>AI Chat</button>
    <button class="nav-btn" data-screen="dossier"><span class="ic">📑</span>Breakdown</button>
  </div>
</div>

<script>
const API = "https://betedge-ai-backend.onrender.com";

// Stadium name + city for the home team of each game — shown so it's clear where
// the game is being played, not just what time.
const STADIUM_INFO = {
  "Arizona Cardinals": { name: "State Farm Stadium", city: "Glendale, AZ" },
  "Atlanta Falcons": { name: "Mercedes-Benz Stadium", city: "Atlanta, GA" },
  "Baltimore Ravens": { name: "M&T Bank Stadium", city: "Baltimore, MD" },
  "Buffalo Bills": { name: "Highmark Stadium", city: "Orchard Park, NY" },
  "Carolina Panthers": { name: "Bank of America Stadium", city: "Charlotte, NC" },
  "Chicago Bears": { name: "Soldier Field", city: "Chicago, IL" },
  "Cincinnati Bengals": { name: "Paycor Stadium", city: "Cincinnati, OH" },
  "Cleveland Browns": { name: "Huntington Bank Field", city: "Cleveland, OH" },
  "Dallas Cowboys": { name: "AT&T Stadium", city: "Arlington, TX" },
  "Denver Broncos": { name: "Empower Field at Mile High", city: "Denver, CO" },
  "Detroit Lions": { name: "Ford Field", city: "Detroit, MI" },
  "Green Bay Packers": { name: "Lambeau Field", city: "Green Bay, WI" },
  "Houston Texans": { name: "NRG Stadium", city: "Houston, TX" },
  "Indianapolis Colts": { name: "Lucas Oil Stadium", city: "Indianapolis, IN" },
  "Jacksonville Jaguars": { name: "EverBank Stadium", city: "Jacksonville, FL" },
  "Kansas City Chiefs": { name: "Arrowhead Stadium", city: "Kansas City, MO" },
  "Las Vegas Raiders": { name: "Allegiant Stadium", city: "Las Vegas, NV" },
  "Los Angeles Chargers": { name: "SoFi Stadium", city: "Inglewood, CA" },
  "Los Angeles Rams": { name: "SoFi Stadium", city: "Inglewood, CA" },
  "Miami Dolphins": { name: "Hard Rock Stadium", city: "Miami Gardens, FL" },
  "Minnesota Vikings": { name: "U.S. Bank Stadium", city: "Minneapolis, MN" },
  "New England Patriots": { name: "Gillette Stadium", city: "Foxborough, MA" },
  "New Orleans Saints": { name: "Caesars Superdome", city: "New Orleans, LA" },
  "New York Giants": { name: "MetLife Stadium", city: "East Rutherford, NJ" },
  "New York Jets": { name: "MetLife Stadium", city: "East Rutherford, NJ" },
  "Philadelphia Eagles": { name: "Lincoln Financial Field", city: "Philadelphia, PA" },
  "Pittsburgh Steelers": { name: "Acrisure Stadium", city: "Pittsburgh, PA" },
  "San Francisco 49ers": { name: "Levi's Stadium", city: "Santa Clara, CA" },
  "Seattle Seahawks": { name: "Lumen Field", city: "Seattle, WA" },
  "Tampa Bay Buccaneers": { name: "Raymond James Stadium", city: "Tampa, FL" },
  "Tennessee Titans": { name: "Nissan Stadium", city: "Nashville, TN" },
  "Washington Commanders": { name: "Northwest Stadium", city: "Landover, MD" },
};
function venueLabel(homeTeamFullName){
  const v = STADIUM_INFO[homeTeamFullName];
  return v ? `${v.name}, ${v.city}` : '';
}
let currentSport = "nfl";
let currentGame = null;
let currentDossier = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.screen===id));
  document.querySelector('.screen.active').scrollTop = 0;
}
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click', ()=>showScreen(b.dataset.screen));
});

function setStatus(state, label){
  const pill = document.getElementById('apiStatus');
  pill.className = 'status-pill ' + (state||'');
  document.getElementById('apiStatusLabel').textContent = label;
}

function fmtOdds(n){
  if(n===undefined || n===null) return '—';
  return n > 0 ? '+'+n : String(n);
}
function findPrice(arr, name){
  if(!arr) return null;
  const hit = arr.find(o=>o.name===name);
  return hit || null;
}
function timeLabel(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short' });
  }catch(e){ return iso; }
}

async function checkHealth(){
  try{
    setStatus('waking','Connecting…');
    const res = await fetch(API + '/health');
    if(res.ok){ setStatus('', 'Live'); return true; }
    setStatus('down','Offline'); return false;
  }catch(e){
    setStatus('down','Unreachable'); return false;
  }
}

async function loadBoard(sport){
  currentSport = sport;
  const list = document.getElementById('boardList');
  list.innerHTML = '<div class="board-msg"><div class="spin"></div><div>Loading live odds — first request can take up to a minute while the server wakes up…</div></div>';
  try{
    const res = await fetch(`${API}/api/games/${sport}`);
    if(!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    setStatus('', 'Live');
    const games = data.games || [];
    if(games.length === 0){
      list.innerHTML = '<div class="board-msg">No games with posted odds for this sport right now — check back closer to game day.</div>';
      return;
    }
    list.innerHTML = games.map(g => renderGameRow(g)).join('');
    list.querySelectorAll('.game-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const id = row.dataset.id;
        const game = games.find(x=>x.id===id);
        openDossier(sport, game);
      });
    });
  }catch(e){
    setStatus('down','Unreachable');
    list.innerHTML = `<div class="board-msg">Couldn't load live odds (${e.message}). The free-tier server may still be waking up — pull down or reselect the sport tab to retry in a moment.</div>`;
  }
}

function renderGameRow(g){
  const home = findPrice(g.moneyline, g.homeTeam);
  const away = findPrice(g.moneyline, g.awayTeam);
  const spreadHome = findPrice(g.spread, g.homeTeam);
  const spreadAway = findPrice(g.spread, g.awayTeam);
  const over = findPrice(g.total, 'Over');
  const under = findPrice(g.total, 'Under');
  const bookCount = (g.allBooks || []).length;
  return `
  <div class="game-row" data-id="${g.id}">
    <div class="game-meta"><span>${timeLabel(g.commenceTime)}</span><span>${venueLabel(g.homeTeam) || g.primaryBook || ''}</span></div>
    <div class="matchup">
      <div class="team-line">
        <span class="team-name">${g.awayTeam}</span>
        <div class="odds-cluster">
          <div class="odds-box"><div class="num">${spreadAway ? fmtOdds(spreadAway.point) : '—'}</div><div class="lbl">Spread</div></div>
          <div class="odds-box"><div class="num">${away ? fmtOdds(away.price) : '—'}</div><div class="lbl">ML</div></div>
          <div class="odds-box"><div class="num">${over ? 'o'+over.point : '—'}</div><div class="lbl">Total</div></div>
        </div>
      </div>
      <div class="team-line">
        <span class="team-name">${g.homeTeam}</span>
        <div class="odds-cluster">
          <div class="odds-box"><div class="num">${spreadHome ? fmtOdds(spreadHome.point) : '—'}</div><div class="lbl">Spread</div></div>
          <div class="odds-box"><div class="num">${home ? fmtOdds(home.price) : '—'}</div><div class="lbl">ML</div></div>
          <div class="odds-box"><div class="num">${under ? 'u'+under.point : '—'}</div><div class="lbl">Total</div></div>
        </div>
      </div>
    </div>
    <div class="book-note">Lines compared across ${bookCount || 1} sportsbook${bookCount===1?'':'s'} — tap for full breakdown</div>
  </div>`;
}

async function openDossier(sport, game){
  currentGame = game;
  currentDossier = null;
  showScreen('dossier');
  const body = document.getElementById('dossierBody');
  body.innerHTML = '<div class="board-msg"><div class="spin"></div><div>Pulling weather, injuries and head-to-head history…</div></div>';
  try{
    const res = await fetch(`${API}/api/dossier/${sport}/${game.id}`);
    if(!res.ok) throw new Error('bad status ' + res.status);
    const dossier = await res.json();
    currentDossier = dossier;
    body.innerHTML = renderDossier(dossier);
    const btn = document.getElementById('askAiBtn');
    if(btn) btn.addEventListener('click', ()=>{
      showScreen('chat');
      document.getElementById('chatInput').focus();
    });
  }catch(e){
    body.innerHTML = `<div class="board-msg">Couldn't load the breakdown (${e.message}). Try again in a moment.</div>`;
  }
}

function formatPrice(p){
  if(p === null || p === undefined) return '—';
  return p > 0 ? '+'+p : String(p);
}
function lineMovementRow(m){
  const label = m.market === 'moneyline' ? `${m.side} ML`
    : m.market === 'total' ? `Total (${m.side})`
    : `${m.side} Spread`;
  const fmt = (point, price) => m.market === 'moneyline'
    ? formatPrice(price)
    : `${point ?? '—'} (${formatPrice(price)})`;
  const openStr = fmt(m.openPoint, m.openPrice);
  const curStr = fmt(m.currentPoint, m.currentPrice);
  return `<div class="fact-row"><span>${label}</span><span class="v">${m.moved ? `${openStr} → ${curStr}` : `${curStr} (unchanged)`}</span></div>`;
}

function renderDossier(d){
  const g = d.game;
  const w = d.weather;
  const inj = d.injuries || [];
  const h2h = d.headToHead || [];
  const h2hResults = d.headToHeadResults || [];
  const lm = d.lineMovement || {};
  let html = `
    <div class="dossier-hero">
      <div class="dossier-title">${g.awayTeam} @ ${g.homeTeam}</div>
      <div class="dossier-sub">${timeLabel(g.commenceTime)}</div>
      <div class="dossier-sub">Home team: ${g.homeTeam}${venueLabel(g.homeTeam) ? ' · ' + venueLabel(g.homeTeam) : ''}</div>
    </div>
    <div class="section">
      <h3>Line movement${lm.book ? ' · ' + lm.book : ''}</h3>
      ${lm.available && lm.hasHistory && lm.summary && lm.summary.length
        ? lm.summary.map(lineMovementRow).join('')
        : `<div class="empty-note">${lm.reason || lm.note || 'Tracking line movement now — check back after the odds refresh a few times to see how the line has moved.'}</div>`}
    </div>
    <div class="section">
      <h3>Head-to-head results</h3>
      ${h2hResults.length ? h2hResults.slice(0,5).map(m=>`<div class="fact-row"><span>${m.awayTeam} ${m.awayScore} @ ${m.homeTeam} ${m.homeScore}</span><span class="v">${m.winner} won · ${m.date ? new Date(m.date).toLocaleDateString() : ''}</span></div>`).join('')
        : '<div class="empty-note">No completed past meetings found in the last 4 seasons.</div>'}
    </div>
    <div class="section">
      <h3>Scheduled meetings (no scores)</h3>
      ${h2h.length ? h2h.slice(0,5).map(m=>`<div class="fact-row"><span>${m.AwayTeam || m.AwayTeamName || ''} @ ${m.HomeTeam || m.HomeTeamName || ''}</span><span class="v">${m.Season || ''} ${m.DateTime ? new Date(m.DateTime).toLocaleDateString() : ''}</span></div>`).join('')
        : '<div class="empty-note">No recent meetings found in this season\'s schedule data.</div>'}
    </div>
    <div class="section">
      <h3>Weather at kickoff</h3>
      ${w ? (w.conditions === 'Dome — no weather impact'
          ? `<div class="fact-row"><span>Venue</span><span class="v">Dome — no weather impact</span></div>`
          : `<div class="fact-row"><span>Temp</span><span class="v">${w.tempF ?? '—'}°F</span></div>
             <div class="fact-row"><span>Wind</span><span class="v">${w.windMph ?? '—'} mph</span></div>
             <div class="fact-row"><span>Precip chance</span><span class="v">${w.precipChance ?? '—'}%</span></div>
             <div class="fact-row"><span>Conditions</span><span class="v">${w.conditions ?? '—'}</span></div>`)
        : '<div class="empty-note">No venue coordinates on file for this matchup yet.</div>'}
    </div>
    <div class="section">
      <h3>Injury report</h3>
      ${inj.length ? inj.slice(0,6).map(i=>`<div class="fact-row"><span><span class="tag${(i.Status||'').toLowerCase()==='active'?' ok':''}">${i.Status||'Unknown'}</span>${i.Name || i.Player || 'Player'} — ${i.BodyPart || i.Injury || 'undisclosed'}</span><span class="v">${i.Team||''}</span></div>`).join('')
        : '<div class="empty-note">No injuries currently reported for either team.</div>'}
    </div>
    <button class="ask-ai-btn" id="askAiBtn">Ask the AI about this game →</button>
  `;
  return html;
}

function addMsg(text, who){
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if(!message) return;
  if(!currentDossier){
    addMsg(message, 'user');
    addMsg('Pick a game from the Board tab first so I have real data to work from — odds, weather, injuries and history for that specific matchup.', 'ai');
    input.value = '';
    return;
  }
  addMsg(message, 'user');
  input.value = '';
  const thinking = addMsg('Thinking…', 'ai');

  async function attempt(timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try{
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message, context: currentDossier }),
        signal: controller.signal
      });
      if(!res.ok) throw new Error('bad status ' + res.status);
      const data = await res.json();
      return data.reply || null;
    } finally {
      clearTimeout(timer);
    }
  }

  try{
    let reply;
    try{
      // Fast path: server is already warm.
      reply = await attempt(12000);
    }catch(firstErr){
      // Render's free tier spins the backend down after ~15 min idle, so a cold
      // server can take up to ~50s to wake up on the first request. Rather than
      // failing right away, tell the user what's happening and give it one more,
      // much longer try before giving up.
      thinking.textContent = 'Server is waking up (this can take up to a minute on the first request)… still trying.';
      reply = await attempt(60000);
    }
    thinking.textContent = reply || "The AI didn't return an answer — try rephrasing the question.";
  }catch(e){
    thinking.textContent = "Couldn't reach the AI server after waiting. It may still be starting up — wait about a minute and send your message again.";
  }
}
document.getElementById('sendBtn').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });

// Voice input via Web Speech API where the browser supports it
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
if(SpeechRec){
  const rec = new SpeechRec();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';
  let listening = false;
  let finalTranscript = '';

  micBtn.addEventListener('click', ()=>{
    if(listening){
      rec.stop();
      return;
    }
    finalTranscript = '';
    document.getElementById('chatInput').value = '';
    listening = true;
    micBtn.classList.add('listening');
    micBtn.title = 'Tap to stop and send';
    try{ rec.start(); }catch(e){ listening=false; micBtn.classList.remove('listening'); }
  });

  rec.addEventListener('result', (e)=>{
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTranscript += transcript + ' ';
      else interim += transcript;
    }
    document.getElementById('chatInput').value = (finalTranscript + interim).trim();
  });

  rec.addEventListener('end', ()=>{
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.title = 'Voice input';
    if(finalTranscript.trim()) sendChat();
  });

  rec.addEventListener('error', (e)=>{
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.title = 'Voice input';
  });
}else{
  micBtn.title = 'Voice input not supported in this browser';
  micBtn.addEventListener('click', ()=>{
    addMsg('Voice input isn\'t supported in this browser — try Chrome on desktop or Android, or type your question instead.', 'ai');
  });
}

document.querySelectorAll('.sport-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    loadBoard(tab.dataset.sport);
  });
});

checkHealth().then(()=>loadBoard('nfl'));
