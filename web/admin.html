<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetEdge AI — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#EDE9DF; --line:#DDD6C6;
  --text:#14181F; --sub:#4A5460; --amber:#C77F1D; --teal:#1F8478; --green:#2C8A55; --red:#B84332;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151C; --surface:#1B222C; --surface2:#212B37; --line:#2C3644;
    --text:#F4F1EA; --sub:#AEB8C3; --amber:#E8A33D; --teal:#3FB6A8; --green:#3FA66B; --red:#D9614F;
  }
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{ max-width:1080px; margin:0 auto; padding:20px 16px 60px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:4px 0 18px; border-bottom:1px solid var(--line); margin-bottom:20px; }
.brand{ font-weight:700; font-size:19px; letter-spacing:-0.3px; }
.brand .amber{ color:var(--amber); }
.brand .sub{ font-size:12px; color:var(--sub); font-weight:500; margin-left:8px; }
.logout-btn, .retry-btn, .save-btn{ background:none; border:1px solid var(--line); color:var(--sub); font-size:12.5px; padding:6px 12px; border-radius:8px; cursor:pointer; font-family:inherit; }
.logout-btn:hover, .retry-btn:hover{ color:var(--text); border-color:var(--sub); }

/* --- gate screen --- */
.gate{ max-width:340px; margin:15vh auto 0; text-align:center; }
.gate h1{ font-size:20px; margin-bottom:6px; }
.gate p{ color:var(--sub); font-size:13px; margin-bottom:20px; }
.gate input{ width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:14px; margin-bottom:10px; font-family:inherit; }
.gate button{ width:100%; padding:11px; border-radius:9px; border:none; background:var(--amber); color:#1a1206; font-weight:700; font-size:14px; cursor:pointer; }
.gate .err{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }

/* --- dashboard --- */
.hidden{ display:none !important; }
.cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.card .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--sub); margin-bottom:6px; }
.card .value{ font-size:22px; font-weight:700; font-family:'Oswald', -apple-system, sans-serif; }
.card .note{ font-size:11.5px; color:var(--sub); margin-top:4px; }

.section{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:18px; }
.section h2{ font-size:14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.section h2 .tag{ font-size:11px; color:var(--sub); font-weight:500; }
.empty-note{ color:var(--sub); font-size:13px; padding:8px 0; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--sub); padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
td{ padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tier-badge{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; text-transform:uppercase; background:var(--surface2); color:var(--sub); white-space:nowrap; }
.tier-badge.standard{ color:var(--teal); }
.tier-badge.edge{ color:var(--amber); }
.tier-badge.edge_pro{ color:var(--red); }
select.tier-select{ font-size:12px; padding:4px 6px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-family:inherit; transition:border-color 0.2s ease; }
select.tier-select.flash-saved{ border-color:var(--green); }
select.tier-select.flash-error{ border-color:var(--red); }
.tier-feedback{ font-size:11px; margin-left:6px; white-space:nowrap; }
.tier-feedback.saved{ color:var(--green); }
.tier-feedback.error{ color:var(--red); }
.search-row{ display:flex; gap:8px; margin-bottom:10px; }
.search-row input{ flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; }
.search-row select{ padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; }
.row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.row-actions button{ font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:none; color:var(--sub); cursor:pointer; font-family:inherit; white-space:nowrap; }
.row-actions button:hover{ color:var(--text); border-color:var(--sub); }
.row-actions button.danger{ color:var(--red); border-color:var(--red); }
.row-actions button.danger:hover{ background:var(--red); color:#fff; }
.row-actions button:disabled{ opacity:0.5; cursor:default; }
.archived-badge{ font-size:10px; font-weight:700; color:var(--sub); background:var(--surface2); padding:1px 6px; border-radius:6px; text-transform:uppercase; margin-left:6px; }
.pager{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
.pager button{ font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:none; color:var(--sub); cursor:pointer; }
.pager button:disabled{ opacity:0.4; cursor:default; }

.bars{ display:flex; align-items:flex-end; gap:3px; height:80px; }
.bar{ flex:1; background:var(--amber); border-radius:2px 2px 0 0; min-height:2px; position:relative; }
.bar-labels{ display:flex; justify-content:space-between; font-size:10px; color:var(--sub); margin-top:6px; }

.spin{ width:22px; height:22px; border:2.5px solid var(--line); border-top-color:var(--amber); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading{ text-align:center; padding:40px 0; color:var(--sub); font-size:13px; }

/* --- health checklist (billing health section) --- */
.health-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:10px; }
.health-row{ display:flex; align-items:center; gap:8px; background:var(--surface2); border-radius:9px; padding:9px 11px; font-size:12.5px; }
.health-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.health-dot.ok{ background:var(--green); }
.health-dot.bad{ background:var(--red); }
.health-row .name{ flex:1; }
.health-row .state{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
.health-row .state.ok{ color:var(--green); }
.health-row .state.bad{ color:var(--red); }

/* --- mobile: shrink everything down so it doesn't feel like a desktop
   dashboard stretched onto a phone --- */
@media (max-width:640px){
  .wrap{ padding:14px 12px 40px; }
  .topbar{ padding:2px 0 12px; margin-bottom:14px; }
  .brand{ font-size:16px; }
  .brand .sub{ font-size:10.5px; margin-left:6px; }
  .logout-btn{ font-size:11px; padding:5px 10px; }

  .cards{ grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:16px; }
  .card{ padding:10px 11px; border-radius:10px; }
  .card .label{ font-size:9.5px; margin-bottom:4px; }
  .card .value{ font-size:17px; }
  .card .note{ font-size:10px; margin-top:2px; }

  .section{ padding:12px; margin-bottom:12px; border-radius:10px; }
  .section h2{ font-size:12.5px; margin-bottom:9px; }
  .section h2 .tag{ font-size:10px; }
  .empty-note{ font-size:12px; padding:6px 0; }

  table{ font-size:11.5px; }
  th{ font-size:9.5px; padding:5px 6px; }
  td{ padding:6px 6px; }
  .tier-badge{ font-size:9.5px; padding:1px 6px; }
  select.tier-select{ font-size:11px; padding:3px 5px; }
  .tier-feedback{ font-size:9.5px; }

  .search-row input{ padding:7px 9px; font-size:12.5px; }
  .search-row select{ padding:7px 9px; font-size:12.5px; }
  .row-actions button{ font-size:10px; padding:3px 7px; }
  .archived-badge{ font-size:9px; }
  .pager button{ font-size:11px; padding:4px 8px; }

  .bars{ height:60px; }
  .bar-labels{ font-size:9px; }

  .health-grid{ grid-template-columns:repeat(2, 1fr); gap:7px; }
  .health-row{ padding:7px 9px; font-size:11px; }
  .health-row .state{ font-size:9.5px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Bet<span class="amber">Edge</span> AI<span class="sub">Admin</span></div>
    <button class="logout-btn hidden" id="logoutBtn">Log out</button>
  </div>

  <div class="gate" id="gate">
    <h1>Admin access</h1>
    <p>Enter the admin key configured on the backend (Render → Environment → <code>ADMIN_KEY</code>).</p>
    <input type="password" id="keyInput" placeholder="Admin key" autocomplete="off">
    <button id="enterBtn">Enter</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="loading" id="loadingMsg"><div class="spin"></div><div style="margin-top:8px;">Loading dashboard…</div></div>

    <div id="dashContent" class="hidden">
      <div class="cards" id="overviewCards"></div>

      <div class="section" id="healthSection">
        <h2>Billing health</h2>
        <div id="healthBody"></div>
      </div>

      <div class="section" id="revenueSection">
        <h2>Subscription revenue <span class="tag">live from Stripe</span></h2>
        <div id="revenueBody"></div>
      </div>

      <div class="section" id="hotpicksSection">
        <h2>Hot Picks <span class="tag" id="hotpicksTag"></span></h2>
        <div id="hotpicksBody"></div>
      </div>

      <div class="section" id="referralsSection">
        <h2>Referral program</h2>
        <div id="referralsBody"></div>
      </div>

      <div class="section">
        <h2>Signups, last 30 days</h2>
        <div id="growthBody"></div>
      </div>

      <div class="section">
        <h2>Odds API usage <span class="tag" id="usageTag"></span></h2>
        <div id="usageBody"></div>
      </div>

      <div class="section">
        <h2>Users <span class="tag" id="usersTag"></span></h2>
        <div class="search-row">
          <input type="text" id="userSearch" placeholder="Search by email…">
          <select id="userStatusFilter">
            <option value="active">Active</option>
            <option value="archived">Archived</option>
            <option value="all">All</option>
          </select>
        </div>
        <div id="usersBody"></div>
        <div class="pager">
          <button id="prevPage">&larr; Prev</button>
          <button id="nextPage">Next &rarr;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://betedge-ai-backend.onrender.com";
const KEY_STORAGE = "betedge_admin_key";
let currentKey = sessionStorage.getItem(KEY_STORAGE) || "";
let usersOffset = 0;
const USERS_LIMIT = 25;
let usersTotal = 0;
let searchDebounce = null;

const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const dashContent = document.getElementById('dashContent');
const loadingMsg = document.getElementById('loadingMsg');
const gateErr = document.getElementById('gateErr');
const logoutBtn = document.getElementById('logoutBtn');

function fmtMoney(cents){
  return '$' + (Number(cents||0)/100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function tierLabel(t){
  const map = { trial:'Trial', standard:'Standard', edge:'Edge', edge_pro:'Edge Pro' };
  return map[t] || t || '—';
}

async function adminFetch(path){
  const res = await fetch(API + path, { headers: { 'x-admin-key': currentKey } });
  if(res.status === 401){
    const err = new Error('unauthorized');
    err.unauthorized = true;
    throw err;
  }
  if(!res.ok) throw new Error('request failed: ' + res.status);
  return res.json();
}

function showGate(message){
  sessionStorage.removeItem(KEY_STORAGE);
  currentKey = "";
  gate.classList.remove('hidden');
  dashboard.classList.add('hidden');
  logoutBtn.classList.add('hidden');
  gateErr.textContent = message || '';
}

function showDashboard(){
  gate.classList.add('hidden');
  dashboard.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');
}

document.getElementById('enterBtn').addEventListener('click', tryKey);
document.getElementById('keyInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryKey(); });
logoutBtn.addEventListener('click', () => showGate());

async function tryKey(){
  const val = document.getElementById('keyInput').value.trim();
  if(!val) return;
  gateErr.textContent = 'Checking…';
  currentKey = val;
  try{
    await adminFetch('/api/admin/usage');
    sessionStorage.setItem(KEY_STORAGE, currentKey);
    showDashboard();
    loadAll();
  }catch(e){
    showGate(e.unauthorized ? 'Invalid admin key.' : ('Couldn\'t reach the admin API (' + e.message + ').'));
  }
}

function renderOverview(usage, revenue, hotpicks){
  const stats = usage.stats || {};
  const cards = [];
  cards.push({ label: 'Total users', value: stats.available ? stats.totalUsers.toLocaleString() : '—' });
  cards.push({ label: 'New users (7d)', value: stats.available ? stats.newUsers7d.toLocaleString() : '—' });
  cards.push({ label: 'Total bets tracked', value: stats.available ? stats.totalBets.toLocaleString() : '—' });
  cards.push({
    label: 'MRR',
    value: revenue.available ? fmtMoney(revenue.mrrCents) : '—',
    note: revenue.available ? null : (revenue.reason || 'Stripe not configured')
  });
  cards.push({
    label: 'Hot Picks revenue',
    value: hotpicks.available ? fmtMoney(hotpicks.totalRevenueCents) : '—',
    note: hotpicks.available ? `${hotpicks.totalPurchases} purchase${hotpicks.totalPurchases === 1 ? '' : 's'}` : null
  });
  document.getElementById('overviewCards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      ${c.note ? `<div class="note">${c.note}</div>` : ''}
    </div>
  `).join('');
}

function renderHealth(health){
  const el = document.getElementById('healthBody');
  const rows = [
    { name: 'Stripe secret key', ok: health.stripeConfigured },
    { name: 'Webhook signing secret', ok: health.webhookConfigured },
    ...health.tiers.map(t => ({ name: `${t.name} price`, ok: t.priceConfigured })),
  ];
  el.innerHTML = `
    <div class="health-grid">
      ${rows.map(r => `
        <div class="health-row">
          <span class="health-dot ${r.ok ? 'ok' : 'bad'}"></span>
          <span class="name">${r.name}</span>
          <span class="state ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'Live' : 'Missing'}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderRevenue(revenue){
  const el = document.getElementById('revenueBody');
  if(!revenue.available){
    el.innerHTML = `<div class="empty-note">${revenue.reason || 'Stripe isn\'t configured yet — revenue will show here once billing is live.'}</div>`;
    return;
  }
  const rows = Object.entries(revenue.byTier || {}).filter(([, v]) => v.count > 0);
  if(!rows.length){
    el.innerHTML = '<div class="empty-note">No active paid subscriptions yet.</div>';
    return;
  }
  el.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr><th>Tier</th><th>Subscribers</th><th>MRR</th></tr></thead>
      <tbody>
        ${rows.map(([tier, v]) => `<tr><td>${tierLabel(tier)}</td><td>${v.count}</td><td>${fmtMoney(v.mrrCents)}</td></tr>`).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function renderHotPicks(hotpicks){
  const tagEl = document.getElementById('hotpicksTag');
  const el = document.getElementById('hotpicksBody');
  if(!hotpicks.available){
    tagEl.textContent = '';
    el.innerHTML = '<div class="empty-note">No database connected.</div>';
    return;
  }
  if(!hotpicks.days.length){
    tagEl.textContent = '';
    el.innerHTML = '<div class="empty-note">No Hot Picks days generated yet.</div>';
    return;
  }
  tagEl.textContent = `${fmtMoney(hotpicks.totalRevenueCents)} total · ${hotpicks.totalPurchases} purchases`;
  el.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr><th>Date</th><th>Price</th><th>Picks</th><th>Sold</th><th>Slots left</th><th>Revenue</th></tr></thead>
      <tbody>
        ${hotpicks.days.map(d => `
          <tr>
            <td>${fmtDate(d.betDate)}</td>
            <td>${fmtMoney(d.priceCents)}</td>
            <td>${d.pickCount}</td>
            <td>${d.purchased} / ${d.maxPurchasers}</td>
            <td>${d.slotsLeft}</td>
            <td>${fmtMoney(d.revenueCents)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function renderReferrals(referrals){
  const el = document.getElementById('referralsBody');
  if(!referrals.available){
    el.innerHTML = '<div class="empty-note">No database connected.</div>';
    return;
  }
  el.innerHTML = `
    <div class="cards" style="margin-bottom:0;">
      <div class="card"><div class="label">Completed referrals</div><div class="value">${referrals.totalRewarded.toLocaleString()}</div><div class="note">${referrals.bonusDays} bonus days each side</div></div>
      <div class="card"><div class="label">Blocked as abuse</div><div class="value">${referrals.totalBlocked.toLocaleString()}</div></div>
    </div>
  `;
}

function renderGrowth(growth){
  const el = document.getElementById('growthBody');
  if(!growth.available || !growth.days.length){
    el.innerHTML = '<div class="empty-note">No signup data yet.</div>';
    return;
  }
  const max = Math.max(...growth.days.map(d => d.signups), 1);
  const bars = growth.days.map(d => `<div class="bar" style="height:${Math.max(2, (d.signups/max)*80)}px" title="${fmtDate(d.date)}: ${d.signups}"></div>`).join('');
  const first = growth.days[0], last = growth.days[growth.days.length-1];
  el.innerHTML = `
    <div class="bars">${bars}</div>
    <div class="bar-labels"><span>${fmtDate(first.date)}</span><span>${fmtDate(last.date)}</span></div>
  `;
}

function renderUsage(usage){
  // getLatestUsage()'s own shape is { available, reason?, hasData?, latest?:
  // { requests_remaining, requests_used, requests_last, recorded_at } } —
  // nested under admin.js's own "latest" key, so this is usage.latest.latest.
  const tagEl = document.getElementById('usageTag');
  const el = document.getElementById('usageBody');
  const wrapper = usage.latest || {};
  if(!wrapper.available){
    tagEl.textContent = '';
    el.innerHTML = `<div class="empty-note">${wrapper.reason || 'Usage tracking isn\'t available (no database connected).'}</div>`;
    return;
  }
  const snapshot = wrapper.latest;
  if(!wrapper.hasData || !snapshot){
    tagEl.textContent = '';
    el.innerHTML = '<div class="empty-note">No usage snapshots recorded yet — this fills in once the odds feed has been polled at least once.</div>';
    return;
  }
  tagEl.textContent = snapshot.recorded_at ? ('as of ' + new Date(snapshot.recorded_at).toLocaleString()) : '';
  el.innerHTML = `
    <div class="cards" style="margin-bottom:0;">
      <div class="card"><div class="label">Requests used</div><div class="value">${snapshot.requests_used ?? '—'}</div></div>
      <div class="card"><div class="label">Requests remaining</div><div class="value">${snapshot.requests_remaining ?? '—'}</div></div>
      <div class="card"><div class="label">Last call cost</div><div class="value">${snapshot.requests_last ?? '—'}</div></div>
    </div>
  `;
}

async function adminAction(path, method){
  const res = await fetch(`${API}${path}`, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-key': currentKey },
  });
  const body = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

async function loadUsers(){
  const search = document.getElementById('userSearch').value.trim();
  const status = document.getElementById('userStatusFilter').value;
  const data = await adminFetch(`/api/admin/users?limit=${USERS_LIMIT}&offset=${usersOffset}&search=${encodeURIComponent(search)}&status=${status}`);
  usersTotal = data.total || 0;
  document.getElementById('usersTag').textContent = data.available ? `${usersTotal.toLocaleString()} total` : '';
  const el = document.getElementById('usersBody');
  if(!data.available){
    el.innerHTML = '<div class="empty-note">No database connected.</div>';
    return;
  }
  if(!data.users.length){
    el.innerHTML = '<div class="empty-note">No users found.</div>';
  } else {
    el.innerHTML = `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Email</th><th>Joined</th><th>Tier</th><th>Status</th><th></th><th></th></tr></thead>
        <tbody>
          ${data.users.map(u => `
            <tr data-id="${u.id}" data-email="${u.email}">
              <td>${u.email}${u.archivedAt ? '<span class="archived-badge">Archived</span>' : ''}</td>
              <td>${fmtDate(u.createdAt)}</td>
              <td><span class="tier-badge ${u.tier}">${tierLabel(u.tier)}</span></td>
              <td>${u.subscriptionStatus || (u.trialEndsAt ? 'trial' : '—')}</td>
              <td>
                <select class="tier-select" data-id="${u.id}" data-current-tier="${u.rawTier}" ${u.archivedAt ? 'disabled' : ''}>
                  ${['trial','standard','edge','edge_pro'].map(t => `<option value="${t}" ${t===u.rawTier?'selected':''}>${tierLabel(t)}</option>`).join('')}
                </select>
                <span class="tier-feedback"></span>
              </td>
              <td>
                <div class="row-actions">
                  ${u.archivedAt
                    ? `<button class="restore-btn" data-id="${u.id}">Restore</button>`
                    : `<button class="archive-btn" data-id="${u.id}">Archive</button>`}
                  <button class="delete-btn danger" data-id="${u.id}" data-email="${u.email}">Delete</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;
    el.querySelectorAll('.tier-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.dataset.id;
        const newTier = sel.value;
        const previousTier = sel.dataset.currentTier;
        const feedback = sel.nextElementSibling; // the .tier-feedback span right after it
        sel.disabled = true;
        sel.classList.remove('flash-saved', 'flash-error');
        feedback.textContent = '';
        feedback.className = 'tier-feedback';
        try{
          const res = await fetch(`${API}/api/admin/users/${id}/tier`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': currentKey },
            body: JSON.stringify({ tier: newTier }),
          });
          // The previous version of this handler updated the badge on ANY
          // response, including a failed one (401 from a stale key, a 500,
          // etc.) — showing "Edge Pro" as if it saved when it hadn't. Check
          // the actual result before touching anything.
          if(!res.ok){
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || `Request failed (${res.status})`);
          }
          const row = sel.closest('tr');
          const badge = row.querySelector('.tier-badge');
          badge.className = `tier-badge ${newTier}`;
          badge.textContent = tierLabel(newTier);
          sel.dataset.currentTier = newTier;
          sel.classList.add('flash-saved');
          feedback.textContent = '✓ Saved';
          feedback.className = 'tier-feedback saved';
          setTimeout(() => {
            sel.classList.remove('flash-saved');
            feedback.textContent = '';
            feedback.className = 'tier-feedback';
          }, 1800);
        }catch(e){
          sel.value = previousTier; // revert the dropdown to the last known-good value
          sel.classList.add('flash-error');
          feedback.textContent = 'Failed: ' + e.message;
          feedback.className = 'tier-feedback error';
        }finally{
          sel.disabled = false;
        }
      });
    });

    el.querySelectorAll('.archive-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const email = btn.closest('tr').dataset.email;
        if(!confirm(`Archive ${email}? They'll be blocked from logging in immediately. This is reversible with "Restore".`)) return;
        btn.disabled = true;
        try{
          await adminAction(`/api/admin/users/${btn.dataset.id}/archive`, 'POST');
          loadUsers();
        }catch(e){
          alert('Failed to archive: ' + e.message);
          btn.disabled = false;
        }
      });
    });

    el.querySelectorAll('.restore-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try{
          await adminAction(`/api/admin/users/${btn.dataset.id}/unarchive`, 'POST');
          loadUsers();
        }catch(e){
          alert('Failed to restore: ' + e.message);
          btn.disabled = false;
        }
      });
    });

    el.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const email = btn.dataset.email;
        const typed = prompt(`This PERMANENTLY deletes ${email} and all their bets, referrals, and purchase history. This cannot be undone.\n\nType the email exactly to confirm:`);
        if(typed === null) return;
        if(typed.trim().toLowerCase() !== email.toLowerCase()){
          alert("That didn't match — nothing was deleted.");
          return;
        }
        btn.disabled = true;
        try{
          const res = await fetch(`${API}/api/admin/users/${btn.dataset.id}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': currentKey },
            body: JSON.stringify({ confirmEmail: typed.trim() }),
          });
          const body = await res.json().catch(() => ({}));
          if(!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
          loadUsers();
        }catch(e){
          alert('Failed to delete: ' + e.message);
          btn.disabled = false;
        }
      });
    });
  }
  document.getElementById('prevPage').disabled = usersOffset === 0;
  document.getElementById('nextPage').disabled = usersOffset + USERS_LIMIT >= usersTotal;
}

document.getElementById('userSearch').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { usersOffset = 0; loadUsers(); }, 350);
});
document.getElementById('prevPage').addEventListener('click', () => { usersOffset = Math.max(0, usersOffset - USERS_LIMIT); loadUsers(); });
document.getElementById('nextPage').addEventListener('click', () => { usersOffset += USERS_LIMIT; loadUsers(); });

async function loadAll(){
  loadingMsg.classList.remove('hidden');
  dashContent.classList.add('hidden');
  try{
    const [usage, revenue, growth, health, hotpicks, referrals] = await Promise.all([
      adminFetch('/api/admin/usage'),
      adminFetch('/api/admin/revenue'),
      adminFetch('/api/admin/growth?days=30'),
      adminFetch('/api/admin/billing-health'),
      adminFetch('/api/admin/hotpicks?days=30'),
      adminFetch('/api/admin/referrals'),
    ]);
    renderOverview(usage, revenue, hotpicks);
    renderHealth(health);
    renderRevenue(revenue);
    renderHotPicks(hotpicks);
    renderReferrals(referrals);
    renderGrowth(growth);
    renderUsage(usage);
    await loadUsers();
    loadingMsg.classList.add('hidden');
    dashContent.classList.remove('hidden');
  }catch(e){
    if(e.unauthorized){ showGate('Invalid admin key.'); return; }
    loadingMsg.innerHTML = `<div class="empty-note">Couldn't load the dashboard (${e.message}). <button class="retry-btn" onclick="loadAll()">Retry</button></div>`;
  }
}

if(currentKey){
  showDashboard();
  loadAll();
}
</script>
</body>
</html>
