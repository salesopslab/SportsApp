# Runs BetEdge's three built-in pickers once a day (~8:05 AM Pacific): picks games starting in the next 24 hours and grades finished ones.
# The backend may be asleep (Render free tier), so this wakes it first. The
# server only runs once per day no matter how often it's pinged.
# Needs one repository secret: PICKS_INGEST_TOKEN (same value as on Render).
name: Run pickers

on:
  schedule:
    # 15:05 and 16:05 UTC = 8:05 AM Pacific in both daylight and standard
    # time; the server runs only once per day (the first ping at/after 8 AM).
    - cron: "5 15 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch: # "Run workflow" button: runs right away, even if today's run already happened

concurrency:
  group: pickers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the backend
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 https://betedge-ai-backend.onrender.com/health; then exit 0; fi
            sleep 20
          done
          echo "Backend didn't wake up"; exit 1
      - name: Run pickers
        env:
          TOKEN: ${{ secrets.PICKS_INGEST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Add the PICKS_INGEST_TOKEN repository secret"; exit 1; fi
          curl -fsS --max-time 240 -X POST https://betedge-ai-backend.onrender.com/api/picks/run \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"daily":${{ github.event_name == 'schedule' }}}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('reason') or ''); print('posted', len(d.get('posted',[])), 'graded', len(d.get('graded',[])), 'errors', d.get('errors')); [print(' +', p['picker'], '|', p['bet'], p['odds'], '|', p['game']) for p in d.get('posted',[])]"
